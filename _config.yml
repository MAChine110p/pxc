title: "蒲星澄"
description: "蒲星澄的个人主页与学习记录"
url: "https://MAChine110p.github.io"
baseurl: "/pxc"
lang: zh-CN
timezone: Asia/Shanghai
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

author:
  name: "蒲星澄"
  role: "北京理工大学 · 信息管理与信息系统"
  location: "中国"
  email: "p1823066877@outlook.com"
  github: "https://github.com/MAChine110p"
  intro: "关注机器学习、计算机视觉与智能系统，持续把学习转化为实践。"

collections:
  pages:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: "蒲星澄"
      permalink: /blog/:year/:month/:day/:title/

